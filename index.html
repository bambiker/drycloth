    <script>
document.getElementById("btncalc").addEventListener("click",doCalc);
      
// editing the values by hand means the user doesn't want the forecast anymore
["temp", "humid", "wind"].forEach(function(id) {
  document.getElementById(id).addEventListener("input", function() {
    document.querySelector('#useforecast').checked = false;
  });
});

    function doCalc()
    {
         var temp = document.getElementById("temp").value;
         var humid = document.getElementById("humid").value;
         var width = document.getElementById("width").value/2.;  //it dries from both sides
         var wind = document.getElementById("wind").value;
         const elem = document.querySelector('#useforecast')
         const sun = document.querySelector('#sun').checked;
         const result = document.getElementById('result');
         const statusmsg = document.getElementById('statusmsg');
         var notes = [];
         var hours;

         result.innerHTML = '';
         statusmsg.innerHTML = '';

         if (elem.checked && weekt2)
            {
             const forecast = forecastcalc(width, sun);
             hours = forecast.hours;
             if (hours === Infinity) {notes.push(msg("nodryforecast"));}
             else {notes.push(msg("dryby", formatTime(new Date(Date.now() + hours*3600*1000))));}
             if (forecast.rain) {notes.push(msg("rain") + " " + msg("rainstart", formatTime(forecast.rainStart)));}
             notes.push(msg("rainprob", forecast.maxProb));
             if (forecast.windy) {notes.push(msg("windy"));}
            } else
            {
             if (temp === "" || humid === "" || wind === "" || !(width > 0) || humid < 0 || humid > 100)
                {
                 statusmsg.innerHTML = msg("badinput");
                 return;
                }
             if (elem.checked) {notes.push(msg("noforecast"));}
             if (sun) {notes.push(msg("sunmanual"));}
             hours = calc(toCelsius(temp),humid,toKmh(wind),width);
             if (hours === Infinity) {notes.push(msg("nodry"));}
            }

         result.innerHTML = (hours === Infinity) ? '-' : formatDuration(hours);
         statusmsg.innerHTML = notes.join('<br>');
    }

    </script>

      function geoFindMe() {
