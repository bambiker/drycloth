name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Playwright 1.56 cannot install Chromium on Ubuntu 26.04 (now ubuntu-latest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
